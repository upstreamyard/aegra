name: Build & publish

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: pick up new upstream releases automatically.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version to build (e.g. 0.10.8). Empty = latest release."
        required: false
        default: ""
      force:
        description: "Rebuild even if this version is already published"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: aegra/aegra
  IMAGE_NAME: aegra
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      minor: ${{ steps.v.outputs.minor }}
      is_latest: ${{ steps.v.outputs.is_latest }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/aegra
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)
          latest=${latest#v}
          version=${INPUT_VERSION:-$latest}
          version=${version#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$version" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          echo "is_latest=$([ "$version" = "$latest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          build=true
          # Scheduled runs only build when the version is not published yet.
          if [ "$EVENT" = "schedule" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" != "true" ]; }; then
            if docker buildx imagetools inspect "${GHCR_IMAGE,,}:$version" >/dev/null 2>&1; then
              echo "$version already published, skipping."
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Upstream latest: $latest | building: $version | build: $build"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signing
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_TOKEN != '' }}
      QUAY_ENABLED: ${{ secrets.QUAY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out upstream v${{ env.VERSION }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: v${{ env.VERSION }}
          path: upstream

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # ---------- Smoke test (amd64) before anything is published ----------
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: aegra:smoke
          build-args: AEGRA_VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test against PostgreSQL
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name pg --network smoke \
            -e POSTGRES_USER=aegra -e POSTGRES_PASSWORD=aegra -e POSTGRES_DB=aegra \
            pgvector/pgvector:pg18
          for i in $(seq 1 30); do docker exec pg pg_isready -U aegra -d aegra && break; sleep 2; done
          docker run -d --name aegra --network smoke -p 2026:2026 \
            -e DATABASE_URL=postgresql://aegra:aegra@pg:5432/aegra \
            -e OPENAI_API_KEY=sk-smoke-test \
            aegra:smoke
          for i in $(seq 1 45); do
            if curl -sf http://localhost:2026/health; then echo; echo "Healthy"; exit 0; fi
            sleep 2
          done
          echo "Aegra did not become healthy"; docker logs aegra; exit 1

      - name: Container logs
        if: always()
        run: docker logs aegra 2>&1 | tail -50 || true

      # ---------- Publish ----------
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true' && env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Quay.io
        if: env.PUBLISH == 'true' && env.QUAY_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Image names
        id: images
        env:
          OWNER: ${{ github.repository_owner }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}
          QUAY_NAMESPACE: ${{ vars.QUAY_NAMESPACE || github.repository_owner }}
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/${OWNER,,}/$IMAGE_NAME"
            [ "$DOCKERHUB_ENABLED" = "true" ] && echo "docker.io/${DOCKERHUB_NAMESPACE,,}/$IMAGE_NAME"
            [ "$QUAY_ENABLED" = "true" ] && echo "quay.io/${QUAY_NAMESPACE,,}/$IMAGE_NAME"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=${{ needs.resolve.outputs.minor }},enable=${{ needs.resolve.outputs.is_latest }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.is_latest }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push (multi-arch)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: AEGRA_VERSION=${{ env.VERSION }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign images (keyless)
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGES: ${{ steps.images.outputs.list }}
        run: |
          for img in $IMAGES; do
            cosign sign --yes "${img}@${DIGEST}"
          done

      - name: Sync Docker Hub description
        if: env.PUBLISH == 'true' && env.DOCKERHUB_ENABLED == 'true' && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}/${{ env.IMAGE_NAME }}
          short-description: "Aegra - self-hosted LangGraph Platform alternative. Multi-arch, signed, SBOM."
          readme-filepath: ./README.md
